name: Allergie-App APK

on:
  push:
    paths:
      - 'apps/allergie-app/**'
      - '.github/workflows/allergie-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        working-directory: apps/allergie-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK ins Repo legen
        run: |
          cp apps/allergie-app/app/build/outputs/apk/release/app-release.apk downloads/allergie-pilot.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add downloads/allergie-pilot.apk
          git commit -m "APK AllergiePilot aktualisiert [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: allergie-pilot-apk
          path: apps/allergie-app/app/build/outputs/apk/release/app-release.apk
